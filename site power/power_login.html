<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Power</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Baloo 2', cursive;
}

body{
    background-color:#532121;
    min-height:100vh;
    position:relative;
}

/* Link superior */

.back{
    position:absolute;
    top:20px;
    left:25px;
}

.back a{
    
    color:#d79b9b;
    font-size: 2rem;
    font-weight:bold
}

/* Título */

h1{
    text-align:center;
    color:#B57474;
    font-size:4rem;
    margin-top:10px;
}

/* Caixa principal */

.login-box{
    width:450px;
    background:#ddb8b8;
    margin:10px auto;
    border-radius:25px;
    border:14px solid #4b0d0d;
    padding:50px 35px;
}

/* Labels */

label{
    display:block;
    color:#3d1818;
    font-size:2rem;
    font-weight:bold;
    margin-bottom:5px;
}

/* Inputs */

input{
    width:100%;
    height:45px;
    border:none;
    border-radius:25px;
    background:#efdcdc;
    padding:0 20px;
    margin-bottom:20px;
    font-size:1.1rem;
}


.buttons{
    display:flex;
    justify-content:space-between;
    margin-top:40px;
}

button{
    width:145px;
    height:80px;
    border:none;
    border-radius:30px;
    background:#efdcdc;
    color:#3d1818;
    font-size:2rem;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:scale(1.05);
}

/* Imagem da Power */

.power-img{
    position:absolute;
    bottom:0;
    left:20px;
}

.power-img img{
    width:250px;
}
</style>
</head>
<body>

<div class="back">
    <a href="index.html">back home</a>
</div>

<h1>Faça o seu login</h1>

<div class="login-box">

    <label>Login</label>
    <input type="text">

    <label>Senha</label>
    <input type="password">

    <div class="buttons">
        <button>cadastrar</button>
        <button>logar</button>
    </div>

</div>

<div class="power-img">
    <img src="power.PNG" alt="Power">
</div>

</body>
</html>
