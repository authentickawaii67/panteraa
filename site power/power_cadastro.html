<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro power</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

body{
    background:#532121;
    height:100vh;
    overflow:hidden;
}

h1{
    text-align:center;
    color:#B57474;
    font-size: 60px;
    margin-top:10px;
    font-weight:bold;
}

.back{
    position:absolute;
    top:30px;
    left:30px;
    color:#f0dede;
    font-size:30px;
    font-weight:bold;
}

.container{
    display:flex;
    justify-content:center;
    margin-top:20px;
}

.card{
    background:#d8b4b4;
    border:12px solid #4d0606;
    border-radius:25px;
    width:450px;
    padding:30px;
}

label{
    display:block;
    font-size:30px;
    font-weight:bold;
    color:#3a1111;
    margin-bottom:10px;
}

input{
    width:100%;
    height:45px;
    border:none;
    border-radius:25px;
    background:#ead7d7;
    margin-bottom:15px;
    padding:0 15px;
}

.botoes{
    display:flex;
    justify-content:space-between;
    margin-top:25px;
}

button{
    width:145px;
    height:75px;
    border:none;
    border-radius:25px;
    background:#ead7d7;
    color:#3a1111;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.personagem{
    position:absolute;
    bottom:0;
    left:20px;
    width: 250px;
}
</style>
</head>

<body>

<a href="index.html" class="back">back home</a>

<h1>Faça seu cadastro</h1>

<div class="container">
    <div class="card">

        <label>E-mail</label>
        <input type="email">

        <label>Senha</label>
        <input type="password">

        <label>Nome</label>
        <input type="text">

        <div class="botoes">
            <button>cancelar</button>
            <button>cadastrar</button>
        </div>

    </div>
</div>

<img src="p2.png" alt="Power" class="personagem">

</body>
</html>
